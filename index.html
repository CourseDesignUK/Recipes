<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Meal Planner Prototype</title>
<style>
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background-color: #f4f4f9; 
        display: flex; 
        justify-content: center; 
        margin: 0; 
        padding: 20px; 
        padding-bottom: env(safe-area-inset-bottom, 20px);
        padding-top: env(safe-area-inset-top, 20px);
        touch-action: pan-y; 
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
    }
    
    #app-container { 
        width: 100%; 
        max-width: 400px; 
        background: #fff; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        box-sizing: border-box; 
        position: relative; 
        overflow: hidden; 
        min-height: 580px;
        display: flex;
        flex-direction: column;
    }

    .screen { flex: 1; display: none; flex-direction: column; position: relative; }
    .screen.active { display: flex; }
    
    #setup-screen, #summary-screen, #favorites-screen { padding: 20px; overflow-y: auto; }
    #swipe-screen { position: relative; overflow: hidden; background: #e9ecef; }

    h2 { margin-top: 0; color: #333; }
    h3 { margin-top: 15px; margin-bottom: 10px; color: #444; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
    input[type="number"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; appearance: none; -webkit-appearance: none; }
    
    button { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 8px; background: #0056b3; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; pointer-events: none; }
    button.secondary { background: #6c757d; margin-top: 10px; }
    
    .swipe-page {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #fff;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        transform-origin: 50% 100%;
        will-change: transform;
        box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }
    
    #page-current { z-index: 2; }
    #page-next { z-index: 1; transform: scale(0.95); opacity: 0.8; }
    
    .swipe-page.dragging { transition: none !important; }
    .swipe-page.swipe-left { transform: translate(-150%, 0) rotate(-15deg) !important; opacity: 0; }
    .swipe-page.swipe-right { transform: translate(150%, 0) rotate(15deg) !important; opacity: 0; }
    .swipe-page.swipe-up { transform: translate(0, -150%) scale(0.8) !important; opacity: 0; }
    
    .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; flex: 1; display: flex; flex-direction: column; position: relative; user-select: none; -webkit-user-select: none; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #ddd; pointer-events: none; }
    .card h3.recipe-title { margin: 0 0 10px 0; font-size: 18px; border: none; padding: 0; pointer-events: none; }
    .card p { color: #666; margin: 5px 0; font-size: 14px; pointer-events: none; }
    .meal-tag { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.7); color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; text-transform: uppercase; pointer-events: none; }
    .info-btn { position: absolute; top: 30px; right: 30px; background: rgba(0,123,255,0.9); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; margin: 0; width: auto; z-index: 10; pointer-events: auto; }
    
    .swipe-controls { display: flex; gap: 10px; position: relative; z-index: 3; }
    .swipe-controls button { margin-top: 0; border-radius: 8px; }
    .btn-left { background: #dc3545; flex: 1; }
    .btn-mid { background: #ffc107; color: #000; flex: 1; }
    .btn-right { background: #28a745; flex: 1; }
    
    .status-bar { display: flex; justify-content: flex-end; font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-weight: bold; pointer-events: none; }
    
    ul { list-style-type: none; padding: 0; margin: 0; margin-bottom: 20px; }
    li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .favorite-item { align-items: center; }
    .favorite-item img { width: 44px; height: 44px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
    .favorite-item div { display: flex; align-items: center; }
    
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    .modal-content { background-color: #fff; margin: 15% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; max-height: 70vh; overflow-y: auto; position: relative; box-sizing: border-box; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .close-modal { position: absolute; right: 15px; top: 15px; color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; padding: 5px; }
    .modal-content h3 { margin-top: 0; padding-right: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .modal-content h4 { margin-top: 15px; margin-bottom: 5px; color: #444; }
    .modal-content ul, .modal-content ol { padding-left: 20px; margin-bottom: 15px; }
    .modal-content li { display: list-item; border-bottom: none; padding: 4px 0; justify-content: flex-start; text-align: left; }
</style>
</head>
<body>

<div id="app-container">
    <div id="setup-screen" class="screen active">
        <h2>Meal Configuration</h2>
        
        <label for="days">Days Cooking</label>
        <input type="number" id="days" value="5" min="1" max="14">
        
        <button onclick="startPlanning()">Start Swiping</button>
        <button class="secondary" onclick="viewFavorites()">View Favorites</button>
    </div>

    <div id="swipe-screen" class="screen">
        <div id="page-next" class="swipe-page">
            <div class="status-bar">
                <span class="meal-status">Meals: 0 / 5</span>
            </div>
            <div class="card">
                <span class="meal-tag">Recipe</span>
                <button class="info-btn" onclick="showRecipeInfo(state.currentRecipeIndex + 1)">Info</button>
                <img class="recipe-image" src="" alt="Recipe Image">
                <h3 class="recipe-title">Loading recipes...</h3>
                <p class="recipe-time">Time: -- mins</p>
            </div>
            <div class="swipe-controls">
                <button class="btn-left">Reject</button>
                <button class="btn-mid">Favorite</button>
                <button class="btn-right">Accept</button>
            </div>
        </div>

        <div id="page-current" class="swipe-page">
            <div class="status-bar">
                <span class="meal-status">Meals: 0 / 5</span>
            </div>
            <div class="card">
                <span class="meal-tag">Recipe</span>
                <button class="info-btn" onclick="showRecipeInfo(state.currentRecipeIndex)">Info</button>
                <img class="recipe-image" src="" alt="Recipe Image">
                <h3 class="recipe-title">Loading recipes...</h3>
                <p class="recipe-time">Time: -- mins</p>
            </div>
            <div class="swipe-controls">
                <button class="btn-left" onclick="triggerSwipe('reject')">Reject</button>
                <button class="btn-mid" onclick="triggerSwipe('favorite')">Favorite</button>
                <button class="btn-right" onclick="triggerSwipe('accept')">Accept</button>
            </div>
        </div>
    </div>

    <div id="summary-screen" class="screen">
        <h2>Weekly Plan Complete</h2>
        
        <h3>Meal Agenda</h3>
        <ul id="meal-agenda"></ul>
        
        <h3>Shopping List</h3>
        <ul id="shopping-list"></ul>
        
        <button onclick="savePlan()">Save Plan</button>
        <button class="secondary" onclick="resetApp()">Start Over</button>
    </div>

    <div id="favorites-screen" class="screen">
        <h2>Favorite Recipes</h2>
        <ul id="favorites-list"></ul>
        <button class="secondary" onclick="resetApp()">Back to Setup</button>
    </div>
</div>

<div id="info-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeRecipeInfo()">&times;</span>
        <h3 id="modal-title">Recipe Details</h3>
        <h4>Ingredients</h4>
        <ul id="modal-ingredients"></ul>
        <h4>Method</h4>
        <ol id="modal-method"></ol>
    </div>
</div>

<script>
    const CARDS_FOLDER = 'RecipeCards';

    let recipes = [];
    let config = { days: 0 };
    let state = { currentRecipeIndex: 0, acceptedMeals: 0, acceptedRecipes: [], ingredientsList: [] };
    let favorites = JSON.parse(localStorage.getItem('bbcMealPlannerFavorites')) || [];
    
    const pageCurrent = document.getElementById('page-current');
    const pageNext = document.getElementById('page-next');

    let touchStartX = 0;
    let touchStartY = 0;
    let currentX = 0;
    let currentY = 0;
    const swipeThreshold = 80;

    pageCurrent.addEventListener('touchstart', e => {
        if (e.target.closest('button') || state.currentRecipeIndex >= recipes.length) return;
        
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        pageCurrent.classList.add('dragging');
        pageCurrent.style.transition = 'none';
        pageNext.style.transition = 'none';
    }, { passive: true });

    pageCurrent.addEventListener('touchmove', e => {
        if (e.target.closest('button') || state.currentRecipeIndex >= recipes.length) return;
        if (!pageCurrent.classList.contains('dragging')) return;

        currentX = e.touches[0].clientX - touchStartX;
        currentY = e.touches[0].clientY - touchStartY;
        
        const rotate = currentX * 0.05;
        pageCurrent.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
        
        const progress = Math.min(Math.abs(currentX) / 150, 1);
        const scale = 0.95 + (0.05 * progress);
        const opacity = 0.8 + (0.2 * progress);
        pageNext.style.transform = `scale(${scale})`;
        pageNext.style.opacity = opacity;
    }, { passive: true });

    pageCurrent.addEventListener('touchend', e => {
        if (e.target.closest('button') || state.currentRecipeIndex >= recipes.length) return;
        if (!pageCurrent.classList.contains('dragging')) return;

        pageCurrent.classList.remove('dragging');
        pageCurrent.style.transition = '';
        pageNext.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease';

        if (currentX < -swipeThreshold) {
            triggerSwipe('reject');
        } else if (currentX > swipeThreshold) {
            triggerSwipe('accept');
        } else if (currentY < -swipeThreshold) {
            triggerSwipe('favorite');
        } else {
            pageCurrent.style.transform = '';
            pageNext.style.transform = 'scale(0.95)';
            pageNext.style.opacity = '0.8';
        }
        currentX = 0;
        currentY = 0;
    }, { passive: true });

    function resetCardStyles(el) {
        if (!el) return;
        el.className = 'swipe-page';
        el.style.transition = '';
        el.style.transform = '';
        el.style.opacity = '';
    }

    function triggerSwipe(action) {
        if (state.currentRecipeIndex >= recipes.length) return;
        
        setControlsState(true);
        
        if (action === 'reject') {
            pageCurrent.classList.add('swipe-left');
        } else if (action === 'accept') {
            pageCurrent.classList.add('swipe-right');
        } else if (action === 'favorite') {
            pageCurrent.classList.add('swipe-up');
        }

        pageNext.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease';
        pageNext.style.transform = 'scale(1)';
        pageNext.style.opacity = '1';

        setTimeout(() => {
            processSwipeAction(action);

            resetCardStyles(pageCurrent);

            pageNext.style.transition = 'none';
            pageNext.style.transform = 'scale(0.95)';
            pageNext.style.opacity = '0.8';

            void pageCurrent.offsetWidth;

            pageCurrent.style.transition = '';
            pageNext.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease';

            if (state.currentRecipeIndex < recipes.length && state.acceptedMeals < config.days) {
                setControlsState(false);
            }
        }, 300);
    }

    function processSwipeAction(action) {
        const recipe = recipes[state.currentRecipeIndex];
        
        if (action === 'favorite') {
            if (!favorites.find(f => f.id === recipe.id)) {
                favorites.push(recipe);
                localStorage.setItem('bbcMealPlannerFavorites', JSON.stringify(favorites));
            }
        } else if (action === 'accept') {
            state.acceptedMeals++;
            state.acceptedRecipes.push(recipe);
            
            recipe.ingredients.forEach(ing => {
                const existing = state.ingredientsList.find(i => i.name === ing.name);
                if (existing) {
                    existing.qty += ing.qty;
                } else {
                    state.ingredientsList.push({ name: ing.name, qty: ing.qty });
                }
            });
        }
        
        state.currentRecipeIndex++;
        
        if (state.acceptedMeals >= config.days) {
            finalizePlan();
        } else {
            loadPages();
        }
    }

    function switchScreen(screenId) {
        if (!screenId || typeof screenId !== 'string') return;
        
        const screens = document.getElementsByClassName('screen');
        for (let i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }

        const target = document.getElementById(screenId);
        if (target) {
            target.classList.add('active');
        } else {
            console.error(`Target screen element not found: #${screenId}`);
        }
    }

    function resolveImagePath(rawPath) {
        if (!rawPath) {
            return "https://images.immediate.co.uk/production/volatile/sites/30/2020/08/bbc-good-food-logo-b171f11.jpg";
        }
        const strPath = String(rawPath);
        if (strPath.startsWith('http://') || strPath.startsWith('https://') || strPath.startsWith('/')) {
            return strPath;
        }
        if (strPath.startsWith(CARDS_FOLDER + '/')) {
            return strPath;
        }
        return `${CARDS_FOLDER}/${strPath}`;
    }

    function normalizeRecipe(source) {
        if (!source) return null;
        const raw = (source.recipes && Array.isArray(source.recipes)) ? source.recipes[0] : source;
        if (!raw || typeof raw !== 'object') return null;

        const rawTimeStr = raw.cook_time !== undefined && raw.cook_time !== null ? String(raw.cook_time) : "45";
        const parsedTime = rawTimeStr.replace(/[^\d]/g, '') || "45";

        const title = (raw.title && typeof raw.title === 'string') ? raw.title.trim() : "Untitled Recipe";
        const id = String(raw.bbc_url || raw.id || title);

        const rawIngredients = Array.isArray(raw.ingredients) ? raw.ingredients.map(String) : [];
        const method = Array.isArray(raw.method) ? raw.method.map(String) : [];

        return {
            id: id,
            title: title,
            image: resolveImagePath(raw.image),
            time: parsedTime,
            type: (raw.category && typeof raw.category === 'string') ? raw.category : "Recipe",
            ingredients: rawIngredients.map(ing => ({ name: ing, qty: 1 })),
            rawIngredients: rawIngredients,
            method: method
        };
    }

    async function startPlanning() {
        config.days = parseInt(document.getElementById('days').value) || 1;

        switchScreen('swipe-screen');
        setControlsState(true);
        const statusText = pageCurrent.querySelector('.recipe-title');
        statusText.innerText = "Loading recipe cards...";

        if (window.location.protocol === 'file:') {
            statusText.innerText = "CORS Error: Serve via HTTP server (e.g. python3 -m http.server)";
            console.error("Fetch blocked by browser on file:// protocol.");
            return;
        }

        try {
            const manifestUrl = `${CARDS_FOLDER}/index.json`;
            const indexResponse = await fetch(manifestUrl);
            
            if (!indexResponse.ok) {
                throw new Error(`Failed to load ${manifestUrl} (HTTP ${indexResponse.status})`);
            }

            const fileList = await indexResponse.json();
            if (!Array.isArray(fileList)) {
                throw new Error(`${manifestUrl} must be a JSON array of filenames.`);
            }

            const fetchPromises = fileList.map(async item => {
                const itemStr = String(item);
                const filePath = itemStr.startsWith(CARDS_FOLDER + '/') ? itemStr : `${CARDS_FOLDER}/${itemStr}`;
                try {
                    const res = await fetch(filePath);
                    if (!res.ok) {
                        console.warn(`Card fetch failed: ${filePath} (HTTP ${res.status})`);
                        return null;
                    }
                    return await res.json();
                } catch (err) {
                    console.warn(`Error parsing ${filePath}:`, err.message);
                    return null;
                }
            });

            const fetchedCards = await Promise.all(fetchPromises);
            recipes = fetchedCards.map(normalizeRecipe).filter(Boolean);

            if (recipes.length === 0) {
                statusText.innerText = `No valid recipes loaded from ${CARDS_FOLDER}/`;
                setControlsState(true);
                return;
            }

            recipes.sort(() => Math.random() - 0.5);

            state = { currentRecipeIndex: 0, acceptedMeals: 0, acceptedRecipes: [], ingredientsList: [] };
            setControlsState(false);
            loadPages();
            
        } catch (error) {
            statusText.innerText = error.message;
            console.error(error);
        }
    }

    function setControlsState(disabled) {
        document.querySelectorAll('#swipe-screen button').forEach(btn => btn.disabled = disabled);
    }

    function loadPages() {
        renderPage(pageCurrent, state.currentRecipeIndex, state.acceptedMeals);
        renderPage(pageNext, state.currentRecipeIndex + 1, state.acceptedMeals);
    }

    function renderPage(pageEl, index, acceptedCount) {
        const titleEl = pageEl.querySelector('.recipe-title');
        const imgEl = pageEl.querySelector('.recipe-image');
        const tagEl = pageEl.querySelector('.meal-tag');
        const timeEl = pageEl.querySelector('.recipe-time');
        const statusEl = pageEl.querySelector('.meal-status');

        if (index >= recipes.length) {
            titleEl.innerText = "No more recipes.";
            imgEl.src = "";
            tagEl.innerText = "END";
            timeEl.innerText = "--";
            pageEl.style.display = (pageEl === pageCurrent) ? 'flex' : 'none';
            return;
        }
        
        pageEl.style.display = 'flex';
        const recipe = recipes[index];
        
        if (statusEl) statusEl.innerText = `Meals: ${acceptedCount} / ${config.days}`;
        imgEl.src = recipe.image;
        titleEl.innerText = recipe.title;
        tagEl.innerText = recipe.type;
        timeEl.innerText = `Time: ${recipe.time} mins`;
    }

    function finalizePlan() {
        const agendaContainer = document.getElementById('meal-agenda');
        agendaContainer.innerHTML = '';
        
        state.acceptedRecipes.forEach(recipe => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${recipe.title}</strong></span> <span style="color:#666; font-size:12px;">${recipe.type}</span>`;
            agendaContainer.appendChild(li);
        });

        const listContainer = document.getElementById('shopping-list');
        listContainer.innerHTML = '';
        
        state.ingredientsList.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.name}</span> <span>x${item.qty}</span>`;
            listContainer.appendChild(li);
        });
        
        switchScreen('summary-screen');
    }

    function savePlan() {
        const plan = {
            date: new Date().toISOString(),
            agenda: state.acceptedRecipes,
            shoppingList: state.ingredientsList
        };
        
        let savedPlans = JSON.parse(localStorage.getItem('bbcMealPlannerSavedPlans')) || [];
        savedPlans.push(plan);
        localStorage.setItem('bbcMealPlannerSavedPlans', JSON.stringify(savedPlans));
        
        alert("Weekly plan saved successfully!");
    }

    function viewFavorites() {
        const listContainer = document.getElementById('favorites-list');
        listContainer.innerHTML = '';

        if (favorites.length === 0) {
            listContainer.innerHTML = '<li>No favorites saved.</li>';
        } else {
            favorites.forEach(fav => {
                const li = document.createElement('li');
                li.className = 'favorite-item';
                li.innerHTML = `
                    <div>
                        <img src="${fav.image}" alt="img">
                        <span>${fav.title}</span>
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }
        
        switchScreen('favorites-screen');
    }

    function resetApp() {
        switchScreen('setup-screen');
    }

    function showRecipeInfo(index) {
        const targetIndex = (typeof index === 'number') ? index : state.currentRecipeIndex;
        if (targetIndex >= recipes.length) return;
        const recipe = recipes[targetIndex];
        
        document.getElementById('modal-title').innerText = recipe.title;
        
        const ingList = document.getElementById('modal-ingredients');
        ingList.innerHTML = '';
        recipe.rawIngredients.forEach(ing => {
            const li = document.createElement('li');
            li.innerText = ing;
            ingList.appendChild(li);
        });

        const methodList = document.getElementById('modal-method');
        methodList.innerHTML = '';
        recipe.method.forEach(step => {
            const li = document.createElement('li');
            li.innerText = step;
            methodList.appendChild(li);
        });

        document.getElementById('info-modal').style.display = 'block';
    }

    function closeRecipeInfo() {
        document.getElementById('info-modal').style.display = 'none';
    }
</script>

</body>
</html>
