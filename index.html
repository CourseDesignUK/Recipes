<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner Prototype</title>
<style>
    body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; margin: 0; padding: 20px; }
    #app-container { width: 100%; max-width: 400px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; }
    .screen { display: none; }
    .screen.active { display: block; }
    h2 { margin-top: 0; color: #333; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 4px; background: #0056b3; color: white; font-size: 16px; cursor: pointer; }
    button.secondary { background: #6c757d; }
    .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; min-height: 350px; display: flex; flex-direction: column; justify-content: flex-start; position: relative; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; background: #ddd; }
    .card h3 { margin: 0 0 10px 0; font-size: 18px; }
    .card p { color: #666; margin: 5px 0; font-size: 14px; }
    .meal-tag { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .swipe-controls { display: flex; gap: 10px; }
    .swipe-controls button { margin-top: 0; }
    .btn-left { background: #dc3545; flex: 1; }
    .btn-mid { background: #ffc107; color: #000; flex: 1; }
    .btn-right { background: #28a745; flex: 1; }
    .status-bar { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    ul { list-style-type: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .favorite-item { align-items: center; }
    .favorite-item img { width: 40px; height: 40px; border-radius: 4px; margin-right: 10px; object-fit: cover; }
    .favorite-item div { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="app-container">
    <div id="setup-screen" class="screen active">
        <h2>Meal Configuration</h2>
        <label for="budget">Weekly Budget (£)</label>
        <input type="number" id="budget" value="50" min="1">
        
        <label for="days">Days Cooking</label>
        <input type="number" id="days" value="5" min="1" max="7">

        <label for="meal-type">Meal Type</label>
        <select id="meal-type">
            <option value="Any">Any</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>
        
        <label for="supermarket">Supermarket</label>
        <select id="supermarket">
            <option value="Waitrose">Waitrose</option>
            <option value="Tesco">Tesco</option>
            <option value="Sainsburys">Sainsbury's</option>
            <option value="Asda">Asda</option>
            <option value="Aldi">Aldi</option>
        </select>
        
        <button onclick="startPlanning()">Start Swiping</button>
        <button class="secondary" onclick="viewFavorites()">View Favorites</button>
    </div>

    <div id="swipe-screen" class="screen">
        <div class="status-bar">
            <span id="budget-status">Budget: £0 / £50</span>
            <span id="meal-status">Meals: 0 / 5</span>
        </div>
        
        <div id="recipe-card" class="card">
            <span id="recipe-tag" class="meal-tag">Loading</span>
            <img id="recipe-image" src="" alt="Recipe Image">
            <h3 id="recipe-title">Loading recipes...</h3>
            <p id="recipe-cost">Cost: £0.00</p>
            <p id="recipe-time">Time: -- mins</p>
        </div>
        
        <div class="swipe-controls">
            <button class="btn-left" id="btn-reject" onclick="handleSwipe('reject')">Reject</button>
            <button class="btn-mid" id="btn-fav" onclick="handleSwipe('favorite')">Favorite</button>
            <button class="btn-right" id="btn-accept" onclick="handleSwipe('accept')">Accept</button>
        </div>
    </div>

    <div id="summary-screen" class="screen">
        <h2>Weekly Plan Complete</h2>
        <div class="status-bar">
            <span>Total Cost: <strong id="final-cost">£0.00</strong></span>
            <span id="final-supermarket">Waitrose</span>
        </div>
        
        <label>Shopping List:</label>
        <ul id="shopping-list"></ul>
        
        <button onclick="resetApp()">Start Over</button>
    </div>

    <div id="favorites-screen" class="screen">
        <h2>Favorite Recipes</h2>
        <ul id="favorites-list"></ul>
        <button class="secondary" onclick="resetApp()">Back to Setup</button>
    </div>
</div>

    let recipes = [];
    let config = { budget: 0, days: 0, supermarket: '', mealType: 'Any' };
    let state = { currentRecipeIndex: 0, acceptedMeals: 0, currentSpent: 0, ingredientsList: [] };
    let favorites = JSON.parse(localStorage.getItem('bbcMealPlannerFavorites')) || [];

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    async function startPlanning() {
        config.budget = parseFloat(document.getElementById('budget').value);
        config.days = parseInt(document.getElementById('days').value);
        config.supermarket = document.getElementById('supermarket').value;
        config.mealType = document.getElementById('meal-type').value;
        
        switchScreen('swipe-screen');
        setControlsState(true);

        let filteredSources = recipeData.recipes; //[cite: 1]
        
        if (config.mealType === "Lunch") {
            filteredSources = filteredSources.filter(r => r.category === "Soup" || r.category === "Salad"); //[cite: 1]
        } else if (config.mealType === "Dinner") {
            filteredSources = filteredSources.filter(r => r.category !== "Soup" && r.category !== "Salad" && r.category !== "Breakfast" && r.category !== "Dessert"); //[cite: 1]
        }
        
        filteredSources.sort(() => Math.random() - 0.5);
        recipes = [];

        for (const source of filteredSources) {
            const parsedIngredients = (source.ingredients || []).map(ing => ({ name: ing, qty: 1 })); //[cite: 1]
            
            recipes.push({
                id: source.bbc_url, //[cite: 1]
                title: source.title || "BBC Recipe", //[cite: 1]
                image: source.image || "https://images.immediate.co.uk/production/volatile/sites/30/2020/08/bbc-good-food-logo-b171f11.jpg", //[cite: 1]
                time: source.cook_time ? source.cook_time.replace(/\D/g, '') : "45", //[cite: 1]
                type: source.category, //[cite: 1]
                ingredients: parsedIngredients, //[cite: 1]
                cost: parseFloat((parsedIngredients.length * 0.95).toFixed(2)) 
            });

            if (recipes.length >= config.days + 3) break; 
        }

        if (recipes.length === 0) {
            document.getElementById('recipe-title').innerText = "No matching recipes found.";
            setControlsState(true);
            return;
        }

        state = { currentRecipeIndex: 0, acceptedMeals: 0, currentSpent: 0, ingredientsList: [] };
        setControlsState(false);
        updateStatusBar();
        loadRecipe();
    }

    function setControlsState(disabled) {
        document.getElementById('btn-reject').disabled = disabled;
        document.getElementById('btn-accept').disabled = disabled;
        document.getElementById('btn-fav').disabled = disabled;
    }

    function updateStatusBar() {
        document.getElementById('budget-status').innerText = `Budget: £${state.currentSpent.toFixed(2)} / £${config.budget.toFixed(2)}`;
        document.getElementById('meal-status').innerText = `Meals: ${state.acceptedMeals} / ${config.days}`;
    }

    function loadRecipe() {
        if (state.currentRecipeIndex >= recipes.length) {
            document.getElementById('recipe-title').innerText = "Out of recipes.";
            setControlsState(true);
            return;
        }
        
        const recipe = recipes[state.currentRecipeIndex];
        document.getElementById('recipe-image').src = recipe.image;
        document.getElementById('recipe-title').innerText = recipe.title;
        document.getElementById('recipe-tag').innerText = recipe.type;
        document.getElementById('recipe-cost').innerText = `Cost: £${recipe.cost.toFixed(2)}`;
        document.getElementById('recipe-time').innerText = `Time: ${recipe.time} mins`;
    }

    function handleSwipe(action) {
        if (state.currentRecipeIndex >= recipes.length) return;
        
        const recipe = recipes[state.currentRecipeIndex];
        
        if (action === 'favorite') {
            if (!favorites.find(f => f.id === recipe.id)) {
                favorites.push(recipe);
                localStorage.setItem('bbcMealPlannerFavorites', JSON.stringify(favorites));
            }
            state.currentRecipeIndex++;
            loadRecipe();
            return;
        }

        if (action === 'accept') {
            if (state.currentSpent + recipe.cost > config.budget) {
                alert("Insufficient budget for this recipe.");
                return;
            }
            
            state.currentSpent += recipe.cost;
            state.acceptedMeals++;
            
            recipe.ingredients.forEach(ing => {
                const existing = state.ingredientsList.find(i => i.name === ing.name);
                if (existing) {
                    existing.qty += ing.qty;
                } else {
                    state.ingredientsList.push({ name: ing.name, qty: ing.qty });
                }
            });
        }
        
        state.currentRecipeIndex++;
        updateStatusBar();
        
        if (state.acceptedMeals >= config.days) {
            finalizePlan();
        } else {
            loadRecipe();
        }
    }

    function finalizePlan() {
        document.getElementById('final-cost').innerText = `£${state.currentSpent.toFixed(2)}`;
        document.getElementById('final-supermarket').innerText = config.supermarket;
        
        const listContainer = document.getElementById('shopping-list');
        listContainer.innerHTML = '';
        
        state.ingredientsList.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.name}</span> <span>x${item.qty}</span>`;
            listContainer.appendChild(li);
        });
        
        switchScreen('summary-screen');
    }

    function viewFavorites() {
        const listContainer = document.getElementById('favorites-list');
        listContainer.innerHTML = '';

        if (favorites.length === 0) {
            listContainer.innerHTML = '<li>No favorites saved.</li>';
        } else {
            favorites.forEach(fav => {
                const li = document.createElement('li');
                li.className = 'favorite-item';
                li.innerHTML = `
                    <div>
                        <img src="${fav.image}" alt="img">
                        <span>${fav.title}</span>
                    </div>
                    <span>£${fav.cost.toFixed(2)}</span>
                `;
                listContainer.appendChild(li);
            });
        }
        
        switchScreen('favorites-screen');
    }

    function resetApp() {
        switchScreen('setup-screen');
    }
</script>

</body>
</html>
